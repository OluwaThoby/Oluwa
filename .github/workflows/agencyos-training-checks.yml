name: AgencyOS training checks

on:
  push:
    paths:
      - "training/**"
      - ".github/workflows/agencyos-training-checks.yml"
  pull_request:
    paths:
      - "training/**"
      - ".github/workflows/agencyos-training-checks.yml"

jobs:
  training-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile training Python files
        run: python -m compileall -q training
      - name: Run dependency-light training and policy tests
        run: |
          python -m unittest discover -s training/tests -p "test_*.py" -v
          python -m unittest discover -s training/phase5 -p "test_*.py" -v
