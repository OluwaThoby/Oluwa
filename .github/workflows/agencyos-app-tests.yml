name: AgencyOS application checks

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/agencyos-app-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/agencyos-app-tests.yml"

jobs:
  finance-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run application unit tests
        run: npm test
