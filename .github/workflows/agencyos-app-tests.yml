name: AgencyOS full web quality gate

on:
  push:
    paths:
      - "src/**"
      - "database/migrations/**"
      - "tests/**"
      - "package.json"
      - "next.config.*"
      - "tsconfig.json"
      - ".github/workflows/agencyos-app-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "database/migrations/**"
      - "tests/**"
      - "package.json"
      - "next.config.*"
      - "tsconfig.json"
      - ".github/workflows/agencyos-app-tests.yml"

jobs:
  web-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run tests and production build
        run: npm run build
